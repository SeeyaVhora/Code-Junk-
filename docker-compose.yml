services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codejunk
      POSTGRES_PASSWORD: codejunk
      POSTGRES_DB: codejunk
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codejunk"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
